services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collabnote

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  server:

    build:
      context: ./server

    ports:
      - "8000:8000"

    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/collabnote
      JWT_SECRET: secret


  frontend:

    build:
      context: ./frontend

    ports:
      - "5173:80"

    depends_on:
      - server


volumes:
  postgres_data: